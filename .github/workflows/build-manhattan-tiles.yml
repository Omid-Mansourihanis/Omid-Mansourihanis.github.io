# Prebuilds the OpenStreetMap building footprints and drivable streets of Manhattan for
# /manhattan-forward-view/, so clicks never wait on the public Overpass servers.
# Source: Geofabrik New York extract (OpenStreetMap contributors, ODbL).
# Run it again from the Actions tab ("Build Manhattan tiles") to refresh the OSM data.
name: Build Manhattan tiles

on:
  workflow_dispatch:
  push:
    branches: [claude/mfv-static]
    paths:
      - 'manhattan-forward-view/scripts/**'
      - '.github/workflows/build-manhattan-tiles.yml'

permissions:
  contents: write

concurrency:
  group: build-manhattan-tiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download the OpenStreetMap New York extract and cut Manhattan
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ny.osm.pbf" https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf
          osmium extract --strategy complete_ways -b -74.035,40.69,-73.895,40.89 "$RUNNER_TEMP/ny.osm.pbf" -o "$RUNNER_TEMP/manhattan.osm.pbf"
          TS=$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$RUNNER_TEMP/ny.osm.pbf" || true)
          echo "OSM_DATE=${TS%%T*}" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP"

      - name: Build tiles
        run: |
          python manhattan-forward-view/scripts/build_tiles.py "$RUNNER_TEMP/manhattan.osm.pbf" \
            --out manhattan-forward-view/data/tiles --date "$OSM_DATE" 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" -eq 0
          du -sh manhattan-forward-view/data/tiles

      - name: Commit the tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manhattan-forward-view/data/tiles
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Build Manhattan tiles from OpenStreetMap ($OSM_DATE)" -m "$(cat "$RUNNER_TEMP/build.log")"
          git push
