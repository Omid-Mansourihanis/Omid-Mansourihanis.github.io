function solve() {

    + `<line x1="${X(ax)}" y1="${Y(ay)}" x2="${X(bx)}" y2="${Y(by)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>`
    + `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(L * r.dx)}" y2="${Y(L * r.dy)}" stroke="var(--red)" stroke-width="2.5"/>`
    + hit + `<circle cx="${X(0)}" cy="${Y(0)}" r="5" fill="var(--ink)"/><text x="${X(0) + 8}" y="${Y(0) + 16}">O</text>`
    + [['A', ax, ay], ['B', bx, by]].map(([n, x, y]) => `<circle class="handle" data-h="${n}" cx="${X(x)}" cy="${Y(y)}" r="11" fill="var(--blue)" stroke="var(--panel)" stroke-width="3"/><text x="${X(x) > W - 110 ? X(x) - 14 : X(x) + 14}" y="${Y(y) - 10}" text-anchor="${X(x) > W - 110 ? 'end' : 'start'}">${n} (${fa(Math.round(x))}, ${fa(Math.round(y))})</text>`).join('');
}
let dragH = null;
$('cast').addEventListener('pointerdown', e => { const h = e.target.closest?.('.handle'); if (h) { dragH = h.dataset.h; e.target.setPointerCapture?.(e.pointerId); e.preventDefault(); } });
$('cast').addEventListener('pointermove', e => {
  if (!dragH || !castMap) return;
  const b = $('cast').querySelector('svg').getBoundingClientRect(), [x, y] = castMap.inv(e.clientX - b.left, e.clientY - b.top);
  C[dragH] = [Math.max(-105, Math.min(125, Math.round(x))), Math.max(-165, Math.min(185, Math.round(y)))]; updateCast();
});
window.addEventListener('pointerup', () => { dragH = null; });
$('cphi').addEventListener('input', e => { C.phi = +e.target.value; updateCast(); });
$('cpresets').addEventListener('click', e => { const p = CPRE[e.target.closest('button')?.dataset.c]; if (!p) return; C.phi = p.phi; C.A = [...p.A]; C.B = [...p.B]; $('cphi').value = p.phi; updateCast(); });
const roCast = new ResizeObserver(() => updateCast()); roCast.observe($('cast'));

/* ---------- section 4: angle conventions ---------- */
const AC = {b: 119.01, phi: 0};
const norm180 = v => { let x = ((v + 180) % 360 + 360) % 360 - 180; return x === -180 ? 180 : x; };
function dial(id, mode) {
  const svg = $(id).querySelector('svg'), W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const cx = W / 2, cy = H / 2 + 14, R = Math.min(W, H) / 2 - 42, comp = mode === 'comp';
  const P = (deg, rr) => [cx + rr * Math.sin(deg * DEG), cy - rr * Math.cos(deg * DEG)];   /* deg as bearing */
  const travel = AC.b, ray = AC.b + AC.phi, zero = comp ? 0 : 90;
  const val = comp ? AC.b : norm180(90 - AC.b);
  /* arc from the zero direction to travel, in the convention's own sense */
  const sweep = comp ? ((travel % 360) + 360) % 360 : norm180(90 - travel), n = 48, pts = [];
  for (let i = 0; i <= n; i++) { const d = comp ? zero + sweep * i / n : zero - sweep * i / n; const [x, y] = P(d, R * 0.42); pts.push(`${x.toFixed(1)},${y.toFixed(1)}`); }
  const arrow = (deg, col, w, rr) => { const [x, y] = P(deg, rr); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${w + 2}" fill="${col}"/>`; };
  svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--rule)" stroke-width="2"/>`
    + [['N', 0], ['E', 90], ['S', 180], ['W', 270]].map(([t, d]) => { const [x, y] = P(d, R + 16); return `<text x="${x}" y="${y + 5}" text-anchor="middle">${t}</text>`; }).join('')
    + arrow(zero, 'var(--grey)', 2, R * 0.92) + `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2"/>`
    + (AC.phi !== 0 ? arrow(ray, 'var(--red)', 2, R * 0.8) : '') + arrow(travel, 'var(--ink)', 4, R * 0.95)
    + `<text x="${cx}" y="16" text-anchor="middle" direction="${lang === 'fa' ? 'rtl' : 'ltr'}" style="font-weight:700;fill:var(--ink)">${T[lang][comp ? 'dcomp' : 'dmath']}: <tspan direction="ltr" unicode-bidi="embed">${fa(val.toFixed(2))}°</tspan></text>`;
}
function updateConv() {
  const b = AC.b, h = norm180(90 - b), phi = AC.phi, a1 = b + phi, a2 = h - phi;
  $('brgo').textContent = fa(b.toFixed(2)) + '°'; $('aphio').textContent = fa(phi) + '°';
  const rows = [['heading = 90° − bearing', fa(h.toFixed(2)) + '°'],
    ['compass: (sin b, cos b)', `(${f2(Math.sin(b * DEG))}, ${f2(Math.cos(b * DEG))})`], ['math: (cos h, sin h)', `(${f2(Math.cos(h * DEG))}, ${f2(Math.sin(h * DEG))})`],
    ['ray, Python: bearing + φ', fa(norm180(a1).toFixed(2)) + '°'], ['ray, geometry.js: heading − φ', fa(norm180(a2).toFixed(2)) + '°']];
  $('asteps').innerHTML = rows.map(([k, v]) => `<div><span dir="ltr">${k}</span><b>${v}</b></div>`).join('');
  $('apresets').innerHTML = [0, 90, 119.01, 299.01].map(v => `<button class="btn" data-b="${v}">${fa(v)}°</button>`).join('');
  dial('dcomp', 'comp'); dial('dmath', 'math');
}
$('brg').addEventListener('input', e => { AC.b = +e.target.value; updateConv(); });
$('aphi').addEventListener('input', e => { AC.phi = +e.target.value; updateConv(); });
$('apresets').addEventListener('click', e => { const v = e.target.closest('button')?.dataset.b; if (v == null) return; AC.b = +v; $('brg').value = v; updateConv(); });
const roDial = new ResizeObserver(() => updateConv()); roDial.observe($('dcomp'));

/* ---------- section 6: exercises (answers computed with the functions above) ---------- */
const canyon = (wl, wr, gw = 0) => { const ps = [rect(-wl - 200, -wl, -2000, 2000)]; if (gw) ps.push(rect(wr, wr + 200, -2000, 5), rect(wr, wr + 200, 5 + gw, 2000)); else ps.push(rect(wr, wr + 200, -2000, 2000)); return measure(edgesOf(ps), 0, 0); };
const Q = [
 {ans: 180 / 5 + 1, tol: 0, fa: 'اگر فاصله‌ی پرتوها ۵ درجه بود، چند پرتو داشتیم؟', en: 'If the rays were 5° apart, how many rays would there be?',
  fa2: '۱۸۰ ÷ ۵ = ۳۶ فاصله، و با دو لبه ۳۷ پرتو.', en2: '180 / 5 = 36 intervals, so 37 rays including both edges.'},
 {ans: opening(canyon(30, 30).d, 80), tol: 0.01, fa: 'دره‌ی تمیز با نماهای ۶۰ فوتی (هر دیوار ۳۰ فوت). θ(80) با شمارش چند درجه است؟', en: 'A clean canyon with faces 60 ft apart (30 ft each side). What is θ(80) by counting rays?',
  fa2: 'مرز arcsin(30/80) = 22.02°. پرتوی 22.5° طول 78.4 دارد و بسته است؛ 17 پرتو (0 و ±2.5 تا ±20) بازند: 17 × 2.5 = 42.5°.', en2: 'The limit is arcsin(30/80) = 22.02°. The 22.5° ray is 78.4 ft long and closed; 17 rays (0 and ±2.5 to ±20) are open: 17 × 2.5 = 42.5°.'},
 {ans: closedForm(30, 30, 80), tol: 0.06, fa: 'همان دره: θc(80) با فرمول بسته (با w = 30) چند درجه است؟ (یک رقم اعشار)', en: 'Same canyon: what is θc(80) from the closed form with w = 30? (one decimal)',
  fa2: '2 × arcsin(30/80) = 2 × 22.02 = 44.0°.', en2: '2 × arcsin(30/80) = 2 × 22.02 = 44.0°.'},
 {ans: closedForm(20, 100, 120), tol: 0.06, fa: 'دیوار چپ ۲۰ و راست ۱۰۰ فوت. θc(120) چند درجه است؟', en: 'Left wall 20 ft, right wall 100 ft. What is θc(120)?',
  fa2: 'arcsin(20/120) + arcsin(100/120) = 9.59 + 56.44 = 66.0°. این بار دیوار راست از R نزدیک‌تر است، پس اشباع نیست.', en2: 'arcsin(20/120) + arcsin(100/120) = 9.59 + 56.44 = 66.0°. The right wall is now nearer than R, so that side no longer saturates.'},
 {ans: 25 * 5280 / 3600 * 2, tol: 0.06, fa: 'با T = 2 ثانیه، R متناظر با ۲۵ مایل بر ساعت چند فوت است؟', en: 'With T = 2 s, what R in feet matches 25 mph?',
  fa2: '25 × 5280 / 3600 = 36.7 فوت بر ثانیه؛ ضرب در 2: حدود 73.3 فوت.', en2: '25 × 5280 / 3600 = 36.7 ft/s; times 2: about 73.3 ft.'},
 {ans: 50, tol: 0.01, fa: 'O = (0,0)، پرتو مستقیم رو به شمال d = (0,1)، ضلع از A = (−30, 50) تا B = (30, 50). t چند است؟ (در بخش «برخورد پرتو و ضلع» امتحان کنید)', en: 'O = (0,0), ray straight north d = (0,1), wall from A = (−30, 50) to B = (30, 50). What is t? (try it in the ray-and-wall bench)',
  fa2: 'e = (60, 0)، a = (−30, 50)، den = 0·0 − 1·60 = −60، t = (0 − 50·60)/(−60) = 50، u = (−30·1 − 0)/(−60) = 0.5.', en2: 'e = (60, 0), a = (−30, 50), den = 0·0 − 1·60 = −60, t = (0 − 50·60)/(−60) = 50, u = (−30·1 − 0)/(−60) = 0.5.'},
 {ans: 150.99, tol: 0.01, mod: 360, fa: 'جهت قطب‌نمای ۲۹۹.۰۱ درجه به قرارداد ریاضی چند درجه است؟', en: 'What is a bearing of 299.01° in the math convention?',
  fa2: '90 − 299.01 = −209.01، که همان 150.99 درجه است.', en2: '90 − 299.01 = −209.01, which is the same direction as 150.99°.'},
 {ans: 0.5 * 450, tol: 0.01, fa: 'یالی ۴۵۰ فوتی. نقطه‌ی نمونه‌ی سوم (وسط) چند فوت از ابتدای آن است؟', en: 'A 450 ft edge. How far from its start is the third (middle) sample point?',
  fa2: 'نقطه‌ها در 30، 40، 50، 60 و 70 درصدند: 135، 180، 225، 270 و 315 فوت.', en2: 'The points are at 30, 40, 50, 60 and 70%: 135, 180, 225, 270 and 315 ft.'},
 {ans: opening(canyon(22, 22, 60).d, 80), tol: 0.01, fa: 'دره‌ی ۴۴ فوتی با خیابان فرعی ۶۰ فوتی در راست (از ۵ تا ۶۵ فوت جلوتر). θ(80) چند درجه است؟ (روی میز کار دره امتحان کنید)', en: 'A 44 ft canyon with a 60 ft side street on the right (5 to 65 ft ahead). What is θ(80)? (try it on the canyon bench)',
  fa2: '29 پرتو باز است: 0 و ±2.5 تا ±15، و در راست 37.5 تا 75 درجه از شکاف. 29 × 2.5 = 72.5°؛ θc = 32.4 و باقیمانده +40.1.', en2: '29 rays are open: 0 and ±2.5 to ±15, plus 37.5 to 75° on the right through the gap. 29 × 2.5 = 72.5°; θc = 32.4, residual +40.1.'}];
const solved = new Set();
function renderQuiz() {
  const t = T[lang];
  $('quiz').innerHTML = Q.map((q, i) => `<li><div>${q[lang]}</div><div class="row"><input id="q${i}" inputmode="decimal" aria-label="${t.check} ${i + 1}"><button class="btn" data-q="${i}" data-a="c">${t.check}</button><button class="btn" data-q="${i}" data-a="s">${t.show}</button></div><p class="fb" id="fb${i}" aria-live="polite"></p><p class="ans" id="an${i}" hidden>${q[lang + '2']}</p></li>`).join('');
  $('qscore').textContent = t.score + fa(solved.size + ' / ' + Q.length);
}
$('quiz').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.q, q = Q[i], t = T[lang];
  if (b.dataset.a === 's') { $('an' + i).hidden = !$('an' + i).hidden; return; }
  const raw = $('q' + i).value.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g, '.').replace(/[−–]/g, '-').trim();
  let v = parseFloat(raw), ok = Number.isFinite(v);
  if (ok) { let diff = Math.abs(v - q.ans); if (q.mod) diff = Math.min(diff % q.mod, q.mod - diff % q.mod); ok = diff <= q.tol + 1e-9; }
  const fb = $('fb' + i); fb.textContent = ok ? t.right : t.wrong; fb.className = 'fb ' + (ok ? 'ok' : 'no');
  if (ok) solved.add(i); $('qscore').textContent = t.score + fa(solved.size + ' / ' + Q.length);
});
$('quiz').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) e.target.nextElementSibling.click(); });

/* ---------- language ---------- */
function setLang(l) {
  lang = l; document.documentElement.lang = l; document.body.dir = l === 'fa' ? 'rtl' : 'ltr'; document.documentElement.dir = document.body.dir;
  $('lfa').setAttribute('aria-pressed', l === 'fa'); $('len').setAttribute('aria-pressed', l === 'en');
  document.querySelectorAll('[data-i]').forEach(n => { n.textContent = T[l][n.dataset.i]; });
  $('drive').textContent = S.driving ? T[l].stop : T[l].drive;
  renderChips(); updateBlock(); updateLab(); updateCast(); updateConv(); renderQuiz();
}
$('lfa').addEventListener('click', () => { setLang('fa'); history.replaceState(null, '', '#fa'); }); $('len').addEventListener('click', () => { setLang('en'); history.replaceState(null, '', location.pathname); });

buildCity(); setView('3d'); setLang(location.hash === '#fa' ? 'fa' : 'en');
}
