    const m = new THREE.Mesh(new THREE.BoxGeometry(b.x1 - b.x0, b.h, b.y1 - b.y0), bMat);
    m.position.copy(P((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, b.h / 2)); m.castShadow = m.receiveShadow = true; city.add(m);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({color: '#b3ada1'}));
    edges.position.copy(m.position); city.add(edges);
  }
  car = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 14), new THREE.MeshLambertMaterial({color: '#d8322b'})); car.castShadow = true; city.add(car);
}
let car;
const RED = new THREE.Color('#d8322b'), GREY = new THREE.Color('#8f8a80');
function drawRays() {
  raysG.clear();
  const x = 0, y = S.pos, eye = 3.5, pos = [], col = [];
  M.d.forEach((d, k) => {
    const a = PHIS[k] * DEG, L = Math.min(d, 700), c = d >= S.R ? RED : GREY;
    pos.push(x, eye, -y, x + L * Math.sin(a), eye, -(y + L * Math.cos(a))); col.push(c.r, c.g, c.b, c.r, c.g, c.b);
  });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  raysG.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors: true})));
  /* translucent fan of the open rays, cut at R */
  const fan = [];
  M.d.forEach((d, k) => { if (k === 72) return; if (d >= S.R && M.d[k + 1] >= S.R) { const a = PHIS[k] * DEG, b = PHIS[k + 1] * DEG; fan.push(x, 0.6, -y, x + S.R * Math.sin(a), 0.6, -(y + S.R * Math.cos(a)), x + S.R * Math.sin(b), 0.6, -(y + S.R * Math.cos(b))); } });
  const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(fan, 3));
  raysG.add(new THREE.Mesh(fg, new THREE.MeshBasicMaterial({color: '#d8322b', transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false})));
  const arc = []; for (let i = 0; i <= 64; i++) { const a = (-90 + 180 * i / 64) * DEG; arc.push(new THREE.Vector3(x + S.R * Math.sin(a), 0.8, -(y + S.R * Math.cos(a)))); }
  const ag = new THREE.BufferGeometry().setFromPoints(arc), al = new THREE.Line(ag, new THREE.LineDashedMaterial({color: '#1d1c1a', dashSize: 4, gapSize: 3})); al.computeLineDistances(); raysG.add(al);
  car.position.copy(P(0, y - 9, 2.5));
}
function setView(v) {
  S.view = v; document.getElementById('v3d').setAttribute('aria-pressed', v === '3d'); document.getElementById('vplan').setAttribute('aria-pressed', v === 'plan');
  ctl.target.copy(P(0, S.pos + 90, 0));
  if (v === 'plan') cam.position.copy(P(0, S.pos + 89, 620)); else cam.position.copy(P(-90, S.pos - 120, 430));
  ctl.update();
}
function resize() { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
const roScene = new ResizeObserver(resize); roScene.observe(host);
(function loop() { ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();

/* ---------- block view numbers and profile ---------- */
const $ = id => document.getElementById(id);
function updateBlock() {
  M = measure(E, 0, S.pos);
  const th = opening(M.d, S.R), n = M.d.filter(v => v >= S.R).length;
  $('th').textContent = fa(th.toFixed(1)) + '°';
  $('nopen').textContent = fa(n + ' / 73');
  $('wlr').textContent = fa(M.wl.toFixed(1) + ' / ' + M.wr.toFixed(1) + ' ft');
  $('thc').textContent = fa(closedForm(M.wl, M.wr, S.R).toFixed(1)) + '°';
  $('mph').textContent = fa((S.R / 2 * 3600 / 5280).toFixed(1) + ' mph');
  $('Ro').textContent = fa(S.R + ' ft'); $('poso').textContent = fa(Math.round(S.pos) + ' ft');
  drawRays(); drawProfile();
}
let profCache = {};
function drawProfile() {
  const svg = $('profile').querySelector('svg'), W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const key = S.kind + S.R; if (!profCache[key]) profCache[key] = Array.from({length: 141}, (_, i) => { const y = 10 + i * 2; return [y, opening(measure(E, 0, y).d, S.R)]; });
  const pts = profCache[key], m = {l: 36, r: 12, t: 10, b: 24}, X = y => m.l + (y - 10) / 280 * (W - m.l - m.r), Y = v => m.t + (1 - v / 180) * (H - m.t - m.b);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const cur = opening(M.d, S.R);
  svg.innerHTML = [0, 90, 180].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--rule)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fa(v)}°</text>`).join('')
    + [0.3, 0.7].map(f => `<line x1="${X(f * BLOCK)}" x2="${X(f * BLOCK)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grey)" stroke-dasharray="4 4"/>`).join('')
    + `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>`
    + `<circle cx="${X(S.pos)}" cy="${Y(cur)}" r="6" fill="var(--red)"/>`
    + `<text x="${m.l}" y="${H - 6}" text-anchor="start">${fa(0)} ft</text><text x="${W - m.r}" y="${H - 6}" text-anchor="end">${fa(BLOCK)} ft</text>`;
}
const roProf = new ResizeObserver(drawProfile); roProf.observe($('profile'));

function setKind(k) { S.kind = k; B = district(k); E = edgesOf(toPolys(B)); profCache = {}; buildCity(); updateBlock(); renderChips(); }
function renderChips() {
  $('streets').innerHTML = Object.keys(T[lang].st).map(k => `<button class="btn" data-k="${k}" aria-pressed="${k === S.kind}">${T[lang].st[k]}</button>`).join('');
  $('presets').innerHTML = Object.keys(T[lang].pr).map(k => `<button class="btn" data-p="${k}">${T[lang].pr[k]}</button>`).join('');
}
$('streets').addEventListener('click', e => { const k = e.target.closest('button')?.dataset.k; if (k) setKind(k); });
$('R').addEventListener('input', e => { S.R = +e.target.value; updateBlock(); });
$('pos').addEventListener('input', e => { S.pos = +e.target.value; updateBlock(); });
$('v3d').addEventListener('click', () => setView('3d'));
$('vplan').addEventListener('click', () => setView('plan'));
let dir = 1, last = 0;
function drive(t) {
  if (!S.driving) return;
  const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
  S.pos += dir * 40 * dt; if (S.pos > 290) { S.pos = 290; dir = -1; } if (S.pos < 10) { S.pos = 10; dir = 1; }
  $('pos').value = S.pos; updateBlock(); requestAnimationFrame(drive);
}
$('drive').addEventListener('click', () => {
  S.driving = !S.driving; $('drive').setAttribute('aria-pressed', S.driving); $('drive').textContent = S.driving ? T[lang].stop : T[lang].drive;
  if (S.driving && !matchMedia('(prefers-reduced-motion: reduce)').matches) { last = 0; requestAnimationFrame(drive); } else if (S.driving) { S.driving = false; $('drive').textContent = T[lang].drive; }
});
/* click on the road moves the driver */
let down = null; const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera({x: (e.clientX - r.left) / r.width * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1}, cam);
  const hit = ray.intersectObject(ground)[0]; if (!hit) return;
  const half = S.kind === 'avenue' ? 52 : 22, y = -hit.point.z;
  if (Math.abs(hit.point.x) < half && y >= 10 && y <= 290) { S.pos = y; $('pos').value = y; updateBlock(); }
});

/* ---------- canyon bench ---------- */
const L = {wl: 22, wr: 22, R: 80, gw: 0};
function labPolys() {
  const ps = [rect(-L.wl - 200, -L.wl, -2000, 2000)];
  if (L.gw > 0) { ps.push(rect(L.wr, L.wr + 200, -2000, 5), rect(L.wr, L.wr + 200, 5 + L.gw, 2000)); } else ps.push(rect(L.wr, L.wr + 200, -2000, 2000));
  return ps;
}
function updateLab() {
  const polys = labPolys(), m = measure(edgesOf(polys), 0, 0), th = opening(m.d, L.R), thc = closedForm(m.wl, m.wr, L.R), res = th - thc;
  $('lth').textContent = fa(th.toFixed(1)) + '°'; $('lthc').textContent = fa(thc.toFixed(1)) + '°';
  $('lres').textContent = fa((res >= 0 ? '+' : '') + res.toFixed(1)) + '°'; $('lgap').textContent = fa(m.gap.toFixed(2));
  const ok = Math.abs(res) <= 5; $('clean').textContent = ok ? T[lang].clean : T[lang].notclean; $('clean').className = 'badge' + (ok ? ' ok' : '');
  $('wlo').textContent = fa(L.wl + ' ft'); $('wro').textContent = fa(L.wr + ' ft'); $('lRo').textContent = fa(L.R + ' ft'); $('gwo').textContent = fa(L.gw + ' ft');
  drawPlan(polys, m);
}
function drawPlan(polys, m) {
  const svg = $('plan').querySelector('svg'), W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const span = Math.max(L.R * 1.25, 130), s = Math.min((W - 20) / (2 * span), (H - 30) / (span * 1.05)), cx = W / 2, cy = H - 18;
  const X = x => cx + x * s, Y = y => cy - y * s, view = span * 1.6;
  const shapes = polys.map(p => `<polygon points="${p.map(q => X(Math.max(-view, Math.min(view, q[0]))) + ',' + Y(Math.max(-40, Math.min(view, q[1])))).join(' ')}" fill="var(--rule)" stroke="var(--grey)"/>`).join('');
  const rays = m.d.map((d, k) => { const a = PHIS[k] * DEG, Lr = Math.min(d, view); return `<line x1="${cx}" y1="${cy}" x2="${X(Lr * Math.sin(a))}" y2="${Y(Lr * Math.cos(a))}" stroke="${d >= L.R ? 'var(--red)' : 'var(--grey)'}" stroke-width="${d >= L.R ? 1.6 : 1}"/>`; }).join('');
  const arc = `<path d="M ${X(-L.R)} ${cy} A ${L.R * s} ${L.R * s} 0 0 1 ${X(L.R)} ${cy}" fill="none" stroke="var(--ink)" stroke-dasharray="5 4"/>`;
  svg.innerHTML = `<defs><clipPath id="cp"><rect x="0" y="0" width="${W}" height="${H - 8}"/></clipPath></defs><g clip-path="url(#cp)">${shapes}${rays}${arc}</g><circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"/><text x="${X(L.R * 0.72) + 6}" y="${Y(L.R * 0.72) - 4}">R = ${fa(L.R)} ft</text>`;
}
const roPlan = new ResizeObserver(() => updateLab()); roPlan.observe($('plan'));
for (const id of ['wl', 'wr', 'gw']) $(id).addEventListener('input', e => { L[id] = +e.target.value; updateLab(); });
$('lR').addEventListener('input', e => { L.R = +e.target.value; updateLab(); });
const PRESETS = {a: {wl: 22, wr: 22, R: 80, gw: 0}, b: {wl: 52, wr: 52, R: 80, gw: 0}, c: {wl: 20, wr: 100, R: 80, gw: 0}, d: {wl: 22, wr: 22, R: 80, gw: 60}};
$('presets').addEventListener('click', e => { const p = PRESETS[e.target.closest('button')?.dataset.p]; if (!p) return; Object.assign(L, p); for (const k of ['wl', 'wr', 'gw']) $(k).value = L[k]; $('lR').value = L.R; updateLab(); });

/* ---------- language ---------- */
function setLang(l) {
  lang = l; document.documentElement.lang = l; document.body.dir = l === 'fa' ? 'rtl' : 'ltr'; document.documentElement.dir = document.body.dir;
  $('lfa').setAttribute('aria-pressed', l === 'fa'); $('len').setAttribute('aria-pressed', l === 'en');
  document.querySelectorAll('[data-i]').forEach(n => { n.textContent = T[l][n.dataset.i]; });
  $('drive').textContent = S.driving ? T[l].stop : T[l].drive;
  renderChips(); updateBlock(); updateLab();
}
$('lfa').addEventListener('click', () => { setLang('fa'); history.replaceState(null, '', '#fa'); }); $('len').addEventListener('click', () => { setLang('en'); history.replaceState(null, '', location.pathname); });

buildCity(); setView('3d'); setLang(location.hash === '#fa' ? 'fa' : 'en');
}
